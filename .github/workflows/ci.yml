name: CI

on:
  push:
    branches: [main, feat/mvp]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Ações fixadas por SHA (cadeia de suprimentos); o Dependabot atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Dependências de produção sem falhas altas/críticas
        run: npm audit --omit=dev --audit-level=high
