name: Deploy (Cloud Run)

# Publica o site no Google Cloud Run a cada push na main, somente depois que o
# workflow "CI" passar para aquele mesmo commit. Também pode ser disparado à mão
# (Actions → Deploy (Cloud Run) → Run workflow), sempre a partir da main.
#
# Autenticação sem chave JSON: o GitHub emite um token OIDC e o Google o troca
# por credenciais temporárias via Workload Identity Federation. O provedor só
# aceita tokens deste repositório na ref refs/heads/main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Um deploy por vez; um deploy novo não cancela o que já está em andamento.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: espaco-byla-eventos
  REGION: us-central1
  SERVICE: espaco-byla-eventos
  IMAGE_REPO: us-central1-docker.pkg.dev/espaco-byla-eventos/site/web
  # Identificadores públicos (não são segredo).
  WIF_PROVIDER: projects/223557602182/locations/global/workloadIdentityPools/github/providers/espaco-byla-eventos
  DEPLOY_SA: github-deployer@espaco-byla-eventos.iam.gserviceaccount.com
  # Valores NEXT_PUBLIC_* vão para o JavaScript do navegador: são públicos por
  # definição (a chave anon do Supabase é protegida por RLS). Segredos ficam no
  # Secret Manager (next-actions-key) e nas variáveis do serviço Cloud Run.
  NEXT_PUBLIC_SUPABASE_URL: https://rlzyjlrcasqbjztgbgit.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsenlqbHJjYXNxYmp6dGdiZ2l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MzgxNjIsImV4cCI6MjEwNTMxNDE2Mn0.GaR64Qgqyy4SS_TQfk00YNGXe2smLsNV-0ZLmXh5R74
  NEXT_PUBLIC_APP_URL: https://ingressos.espacobyla.online
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFVqgu6dbyOt8LlH

jobs:
  deploy:
    # Só publica se o CI passou num push da main (ou disparo manual na main).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Commit a publicar
        id: rev
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHA="${RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REPO:${SHA::7}" >> "$GITHUB_OUTPUT"

      # Ações fixadas por SHA (cadeia de suprimentos); o Dependabot atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rev.outputs.sha }}
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build da imagem (Cloud Build)
        env:
          IMAGE: ${{ steps.rev.outputs.image }}
        run: |
          gcloud builds submit . \
            --project "$PROJECT_ID" \
            --config infra/cloudrun/cloudbuild.yaml \
            --substitutions "_IMAGE=$IMAGE,_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL,_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY,_APP_URL=$NEXT_PUBLIC_APP_URL,_TURNSTILE_SITE_KEY=$NEXT_PUBLIC_TURNSTILE_SITE_KEY"

      - name: Deploy no Cloud Run
        env:
          IMAGE: ${{ steps.rev.outputs.image }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --quiet
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-latest \
            --quiet
